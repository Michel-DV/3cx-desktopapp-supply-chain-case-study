name: Materialize CASE-003 source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble canonical report source
        run: |
          cat report/.source-part-1.html report/.source-part-2.html report/.source-part-3.html > report/source.html
          test -s report/source.html
          grep -q '23. Evidence trail' report/source.html
          rm report/.source-part-1.html report/.source-part-2.html report/.source-part-3.html
          rm .github/workflows/materialize-source.yml

      - name: Commit canonical source
        run: |
          git config user.name "Michel-DV"
          git config user.email "232046078+Michel-DV@users.noreply.github.com"
          git add -A
          git commit -m "report: materialize canonical CASE-003 source"
          git push
